baseURL: "https://evergreendata.me/"
locale: "en-us"
title: "Ben Mathewson | BI & Data Engineer"
theme: "hugo-profile"

params:
  # Personal branding & metadata
  title: "Ben Mathewson"
  subtitle: "End-to-End Data Products and Consulting"
  description: "Building scalable data products from the ground up-turning raw pipeline chaos into actionable decision engines."
  copyright: "Ben Mathewson • Founder, Evergreen Data Architects"
  customCSS:
    - "css/custom.css"

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    defaultTheme: "dark" # light

  # set the favicon for the site (relative to the static folder)
  favicon: "./images/projects/eda_favicon.png"
      
  # Font settings for the site
  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 300 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: right # default: left

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    brandLogo: "./images/projects/eda_favicon.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    # brandName: "Hugo Profile" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      # showOnScrollUp : true
      showOnScroll : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false
  
  # Hero Section
  hero:
    enable: true
    intro: "Ben Mathewson, BI Engineer & Data Architect"
    title: "Evergreen Data Architects"
    subtitle: "Your data has possibilities. Your budget has limits. Let's bridge the gap."
    content: "Modern data management and analytics solutions that drive business outcomes."
    image: "./images/projects/eda_logo.jpg"
    icon: "fas fa-database"
    # Explicitly turn off the decorative SVG grid pattern
    bottomImage:
      enable: false
    button:
      enable: true
      name: "Download Resume"
      url: "./docs/Ben_Mathewson_Resume.pdf"
      download: true
      newPage: false
    # configure the social links to display in the hero section
    socialLinks:
      enable: true
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/mathewsonb
        - icon: fab fa-linkedin
          url: https://linkedin.com/in/ben-mathewson

  # About Section (Renders skills inside the about partial)
  about:
    enable: true
    title: "Services and Skills"
    content: "Experienced BI Engineer and Data Architect specializing in building end-to-end data products that serve real-world business needs."
    image: "./images/projects/ete_data_process.jpg" # placeholder image for the about section
    skills:
      enable: true
      items:
        - 'Azure Synapse'
        - 'Google Apps Script'
        - 'Python'
        - 'JavaScript'
        - 'R'
        - 'SQL'
        - 'REST APIs'
        - 'Tableau'
        - 'Power BI'
        - 'Looker'
        - 'ETL/ELT Pipelines'
        - 'Data Warehousing'
        - 'Data Modeling'
        - 'Data Governance'

  # Projects Section
  projects:
    enable: true
    title: "Products and Projects"
    items:
      - title: "Vivida Local Events Aggregator"
        description: "Hyperlocal event aggregator for Tacoma, WA, built with Python, React, and SQL. Consolidates events from multiple sources into a single, user-friendly interface, with no registration required (100% user privacy commitment)."
        image: "images/projects/vivida_app.jpg"
        tags: ["React", "PostgreSQL", "Python", "JavaScript"]
        links:
          - icon: "fas fa-external-link-alt"
            url: "https://mathewsonb.github.io/vivida_app/"
          - icon: "fab fa-github"
            url: "https://github.com/mathewsonb/vivida_app"

  # Contact Section
  contact:
    enable: true
    title: "Contact Me"
    email: "lifelonglearning@akindledflame.com"
    btnName: "Send Email"
    content: "Whether you need end-to-end data products or executive BI consulting through Evergreen Data Architects, feel free to reach out!"

  # Footer Social Links
  social:
    - icon: "fab fa-github"
      url: "https://github.com/mathewsonb"
    - icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/ben-mathewson/"
    - icon: "fas fa-envelope"
      url: "mailto:lifelonglearning@akindledflame.com"