<!--
OVERRIDE THE DEFAULT CONTACT PARTIAL WITH THIS CUSTOM PARTIAL
-->
{{ if .Site.Params.contact.enable | default false }}
<section id="contact" class="py-5">
  <div class="container text-center">
    <h2 class="text-center mb-4">{{ .Site.Params.contact.title | default "Get In Touch" }}</h2>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <p class="mb-4">{{ .Site.Params.contact.content | markdownify }}</p>
        
        <!-- Button that opens the Modal Popup -->
        <button type="button" class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#interestModal">
          {{ .Site.Params.contact.btnName | default "Send Inquiry" }}
        </button>
      </div>
    </div>
  </div>
</section>

<!-- Interest Form Modal -->
<div class="modal fade" id="interestModal" tabindex="-1" aria-labelledby="interestModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-start">
      <div class="modal-header">
        <h5 class="modal-title" id="interestModalLabel">Evergreen Data Architects - Inquiry</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="interestForm" action="https://api.web3forms.com/submit" method="POST">
          <!-- Web3Forms Access Key -->
          <input type="hidden" name="access_key" value="7cf738c1-d915-4c4c-ade3-4a3f52c5c560">
          <input type="hidden" name="subject" value="New Inquiry for Evergreen Data Architects">

          <div class="mb-3">
            <label for="clientName" class="form-label">Your Name / Organization</label>
            <input type="text" name="name" class="form-control" id="clientName" placeholder="e.g., Jane Doe / Acme Corp" required>
          </div>
          
          <div class="mb-3">
            <label for="clientEmail" class="form-label">Your Email Address</label>
            <input type="email" name="email" class="form-control" id="clientEmail" placeholder="name@company.com" required>
          </div>

          <div class="mb-3">
            <label for="serviceInterest" class="form-label">Primary Service Area</label>
            <select name="service" class="form-select" id="serviceInterest" required>
              <option value="End-to-End Data Pipeline / ETL">End-to-End Data Pipeline / ETL</option>
              <option value="Data Warehousing & Modeling">Data Warehousing & Modeling</option>
              <option value="BI Dashboards & Analytics">BI Dashboards & Analytics</option>
              <option value="General Architecture Consulting">General Architecture Consulting</option>
              <option value="Offer of Employment">Offer of Employment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          
          <div class="mb-3">
            <label for="projectDetails" class="form-label">Project Scope & Timeline</label>
            <textarea name="message" class="form-control" id="projectDetails" rows="4" placeholder="Briefly describe what you're looking to build..." required></textarea>
          </div>

          <div id="formStatus" class="mb-3 d-none alert"></div>

          <div class="modal-footer px-0 pb-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="submitBtn" class="btn btn-primary">Submit Inquiry</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('interestForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const form = e.target;
  const status = document.getElementById('formStatus');
  const btn = document.getElementById('submitBtn');

  btn.disabled = true;
  btn.innerText = "Sending...";

  // Explicit endpoint target to prevent relative routing 404s
  const endpoint = "https://api.web3forms.com/submit";

  fetch(endpoint, {
    method: 'POST',
    body: new FormData(form)
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      status.className = "mb-3 alert alert-success";
      status.innerText = "Thank you! Your message has been sent successfully.";
      status.classList.remove('d-none');
      form.reset();
      setTimeout(() => {
        const modalEl = document.getElementById('interestModal');
        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
        modal.hide();
        status.classList.add('d-none');
        btn.disabled = false;
        btn.innerText = "Submit Inquiry";
      }, 2000);
    } else {
      throw new Error(data.message);
    }
  })
  .catch(error => {
    console.error("Form Submission Error:", error);
    status.className = "mb-3 alert alert-danger";
    status.innerText = "Something went wrong. Please try again or reach out directly via email.";
    status.classList.remove('d-none');
    btn.disabled = false;
    btn.innerText = "Submit Inquiry";
  });
});
</script>
{{ end }}
